name: Deploy to VM via Tailscale

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout code
        uses: actions/checkout@v4

      - name: 🛡️ Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: 🐳 Deploy with Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 100.127.24.54        # 가상머신 Tailscale IP
          username: leeon            # 사용자 계정명
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "Connected to VM successfully!"
            docker ps
            echo "Deployment successful via Tailscale network!"