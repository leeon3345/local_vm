name: ☸️ K8s Deploy local_vm
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: echo 'no tests'

  build-and-push:
    name: 🏗️ Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4
      - name: 🔐 Login to Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🏗️ Build & Push React image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            your-registry/local_vm-react:latest
            your-registry/local_vm-react:${{ github.sha }}
      - name: 🏗️ Build & Push Python FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            your-registry/local_vm-python-fastapi:latest
            your-registry/local_vm-python-fastapi:${{ github.sha }}
  deploy:
    name: ☸️ Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4
      - name: ☸️ Set up kubectl
        uses: azure/setup-kubectl@v3
      - name: 🔐 Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - name: 🚀 Apply K8s manifests
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment --namespace=default --timeout=120s
      - name: ✅ Verify deployment
        run: kubectl get all -n default