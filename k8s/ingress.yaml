apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: default-ingress
  annotations:
    # NGINX 전용 rewrite 제거 (Traefik 및 기본 설정 호환)
    kubernetes.io/ingress.class: "traefik" 
spec:
  rules:
  - host: myapp.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-svc
            port:
              number: 80
      - path: /api/python-fastapi
        pathType: Prefix
        backend:
          service:
            name: python-fastapi-svc
            port:
              number: 8000