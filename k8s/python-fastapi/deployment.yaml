apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-fastapi
  namespace: default
  labels:
    app: python-fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-fastapi
  template:
    metadata:
      labels:
        app: python-fastapi
    spec:
      containers:
        - name: python-fastapi
          image: leeon3345/local_vm-python-fastapi:latest
          command: ["uvicorn"]
          args: ["main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              protocol: TCP
